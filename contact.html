<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us — Jelajah.id</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="banner"
    data-image="assets/img/raja-ampat/09.jpg"
    data-eyebrow="Contact us"
    data-title="We are here to help, 24/7"
    data-subtitle="Questions about a booking, payment or refund? Reach us any time."></section>

  <main class="page-main" style="padding-top:56px">
    <div class="container layout-sidebar layout-contact">
      <div>
        <div class="card contact-info">
          <span class="feature__icon bg-coral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
          <div><small>Office</small>Jl. Malioboro No. 52, Yogyakarta</div>
        </div>
        <div class="card contact-info">
          <span class="feature__icon bg-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <div><small>WhatsApp / phone</small>+62 812 3456 7890</div>
        </div>
        <div class="card contact-info">
          <span class="feature__icon bg-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <div><small>Email</small>hello@jelajah.id</div>
        </div>
        <div class="card contact-info">
          <span class="feature__icon bg-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><small>Office hours</small>Mon–Sat, 08.00–20.00 WIB</div>
        </div>
      </div>

      <form class="card contact-form" onsubmit="event.preventDefault(); this.reset();">
        <h2>Send us a message</h2>
        <p>We usually reply within 2 hours during office hours.</p>
        <div class="form-grid form-grid--2">
          <input class="input" type="text" placeholder="Full name" required>
          <input class="input" type="email" placeholder="Email" required>
          <input class="input" type="tel" placeholder="Phone / WhatsApp (optional)">
          <select class="select">
            <option>Booking question</option>
            <option>Payment</option>
            <option>Refund &amp; cancellation</option>
            <option>Partnership</option>
            <option>Other</option>
          </select>
          <input class="input" type="text" placeholder="Booking code (if any)">
          <textarea class="textarea span-all" rows="5" placeholder="How can we help?" required></textarea>
        </div>
        <button class="btn btn--primary btn--lg" type="submit" style="margin-top:16px">Send message</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
