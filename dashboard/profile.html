<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Jelajah.id</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="bookings" data-root="../">
  <div id="site-header"></div>

  <section class="banner"
    data-image="../assets/img/mount-bromo/01.jpg"
    data-eyebrow="My account"
    data-title="Profile &amp; security"
    data-subtitle="Keep your contact details up to date so e-tickets reach you."></section>

  <main class="page-main">
    <div class="container layout-sidebar">
      <aside class="card side-nav">
        <div class="account-user"><span class="avatar bg-coral">RP</span><div><strong>Rizky Pratama</strong><small>rizky.pratama@mail.com</small></div></div>
        <a href="index.html">My bookings</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="profile.html" class="is-active">Profile &amp; security</a>
        <a href="../sign-in.html">Sign out</a>
      </aside>

      <div>
        <form class="card card-pad form-section" action="profile.html">
          <h2>Personal information</h2>
          <p>Used as the lead guest name on your e-tickets.</p>
          <div class="form-grid form-grid--2">
            <div><label class="label" for="p-name">Full name</label><input class="input" id="p-name" value="Rizky Pratama" required></div>
            <div><label class="label" for="p-email">Email</label><input class="input" id="p-email" type="email" value="rizky.pratama@mail.com" required></div>
            <div><label class="label" for="p-phone">Phone</label><input class="input" id="p-phone" type="tel" value="+62 812 3456 7890"></div>
            <div><label class="label" for="p-birth">Date of birth</label><input class="input" id="p-birth" type="date" value="2001-05-14"></div>
            <div><label class="label" for="p-id">ID / passport number</label><input class="input" id="p-id" value="3273011405010003"></div>
            <div><label class="label" for="p-city">City</label><input class="input" id="p-city" value="Bandung"></div>
          </div>
          <div class="form-actions"><button class="btn btn--primary" type="submit">Save profile</button></div>
        </form>

        <form class="card card-pad form-section" action="profile.html">
          <h2>Change password</h2>
          <div class="form-grid">
            <div><label class="label" for="p-old">Current password</label><input class="input" id="p-old" type="password" required></div>
            <div><label class="label" for="p-new">New password</label><input class="input" id="p-new" type="password" minlength="6" required></div>
            <div><label class="label" for="p-new2">Confirm new password</label><input class="input" id="p-new2" type="password" minlength="6" required></div>
          </div>
          <div class="form-actions"><button class="btn btn--primary" type="submit">Update password</button></div>
        </form>

        <form class="card card-pad form-section" action="profile.html">
          <h2>Notifications</h2>
          <label class="check" style="margin-bottom:10px"><input type="checkbox" checked> Booking confirmations and e-tickets by email</label>
          <label class="check" style="margin-bottom:10px"><input type="checkbox" checked> Payment reminders by WhatsApp</label>
          <label class="check"><input type="checkbox"> Promos and holiday deals</label>
          <div class="form-actions"><button class="btn btn--primary" type="submit">Save preferences</button></div>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
