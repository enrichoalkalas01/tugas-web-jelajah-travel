<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My bookings — Jelajah.id</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="bookings">
  <div id="site-header"></div>

  <section class="banner"
    data-image="assets/img/borobudur-temple/09.jpg"
    data-eyebrow="My bookings"
    data-title="Your trips &amp; e-tickets"
    data-subtitle="Bookings made on this device are saved here."></section>

  <main class="page-main">
    <div class="container">
      <article class="card list-card">
        <img class="list-card__img" src="assets/img/borobudur-temple/01.jpg" alt="Borobudur Temple">
        <div class="list-card__body">
          <span class="tag tag--success">Confirmed</span>
          <h3 class="list-card__title">Borobudur Temple</h3>
          <div class="list-card__meta" style="font-size:14px">Entrance ticket &middot; Sat, 31 Oct 2026 &middot; 2 adults</div>
          <p class="list-card__desc" style="font-size:13px">Booking code <strong style="color:var(--text)">JLJ-GFUOT6</strong> &middot; Paid with Bank transfer</p>
        </div>
        <div class="list-card__side" style="align-items:center">
          <span class="price" style="align-self:flex-start">Rp 100.000</span>
          <a class="btn btn--primary btn--block" href="e-ticket.html">View e-ticket</a>
          <a class="btn-link" href="refund-policy.html">Cancel booking</a>
        </div>
      </article>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
