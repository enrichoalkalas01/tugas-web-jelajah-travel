# Helm values (chart generic-app) — Jelajah.id, static site served by nginx.
# appName, image.repository/tag and service.nodePort are overridden by the pipeline (--set).
appName: jelajah-id-dev
namespace: portofolio

replicaCount: 1

image:
    repository: 192.168.20.21/other/jelajah-id-dev
    tag: "latest"
    pullPolicy: Always

imagePullSecrets:
    - name: harbor-creds

nameOverride: ""
fullnameOverride: ""

containerPort: 8080

service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 31157

# Disabled until a hostname is chosen. A blank host would collide with
# portofolio-event-music-fe, which already owns the catch-all "/" on this controller.
ingress:
    enabled: false
    className: nginx-endlessapp
    annotations: {}
    hosts:
        - host: "dev.jelajah.example.com"
          paths:
              - path: /
                pathType: Prefix
    tls: []

probe:
    enabled: true
    liveness:
        path: /health
        port: 8080
        initialDelaySeconds: 5
        periodSeconds: 20
    readiness:
        path: /health
        port: 8080
        initialDelaySeconds: 2
        periodSeconds: 10

resources:
    requests:
        cpu: 10m
        memory: 16Mi
    limits:
        cpu: 200m
        memory: 64Mi

autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

env: []
envFrom: []

# nginx-unprivileged runs as uid 101 and writes pid/cache files to /tmp only.
podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
        type: RuntimeDefault

securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
        drop:
            - ALL

volumes:
    - name: tmp
      emptyDir: {}
volumeMounts:
    - name: tmp
      mountPath: /tmp

hostAliases: []
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
    create: false
    name: ""
    annotations: {}
